name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: scripts/check
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # xcode-select rather than DEVELOPER_DIR, so the SwiftLint plugin's SourceKit lookup follows it.
      - name: Select Xcode 26.6
        run: sudo xcode-select -s /Applications/Xcode_26.6.app

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version
          swift format --version

      # GitHub sets CI=true: pixel snapshots and Periphery are skipped, and without SEXTANT_REFERENCE the tests run
      # on the author's own layout only.
      - name: Check
        run: scripts/check
